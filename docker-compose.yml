services:
  db:
    image: mariadb:11
    container_name: wtg-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cpanel
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-provision:
    image: mariadb:11
    container_name: wtg-db-provision
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/db/init.sql:/init.sql:ro
    environment:
      MYSQL_PWD: rootpass
    entrypoint: ["sh", "-c", "mariadb -h db -uroot < /init.sql"]
    restart: "no"

  hosting:
    build:
      context: ./docker/hosting
    container_name: wtg-hosting
    restart: unless-stopped
    hostname: hosting
    ports:
      - "8080:80"
      - "2222:22"
    volumes:
      # WordPress trees: /home/deploy/public_html/{site1,site2,site3}
      - ./sites:/home/deploy/public_html
      - ./docker/ssh/deploy_ed25519.pub:/etc/ssh/deploy.pub:ro
    depends_on:
      db:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "php -v >/dev/null && wp --info >/dev/null && pgrep sshd >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
